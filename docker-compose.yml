services:
  api:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-dockerproxy.net/library/python:3.11-slim}
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
  postgres:
    image: dockerproxy.net/library/postgres:15
    environment:
      POSTGRES_USER: fincontract
      POSTGRES_PASSWORD: fincontract
      POSTGRES_DB: fincontract
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: dockerproxy.net/library/redis:7
    ports:
      - "6379:6379"
volumes:
  postgres_data:
