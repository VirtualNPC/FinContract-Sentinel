[project]
name = "fincontract-sentinel"
version = "0.1.0"
description = "Financial and contract audit agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.24,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "langchain>=0.2,<0.3",
  "chromadb>=0.5,<0.6",
  "psycopg[binary]>=3.1,<4.0",
  "pgvector>=0.2,<1.0",
  "redis>=5.0,<6.0",
  "celery>=5.3,<6.0",
  "structlog>=24.1,<25.0",
  "python-multipart>=0.0.9,<1.0",
  "pdfplumber>=0.11,<1.0",
  "PyPDF2>=3.0,<4.0",
  "pdf2image>=1.17,<2.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "tenacity>=8.2,<9.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<0.24",
  "ruff>=0.4,<0.5",
  "black>=24.0,<25.0",
  "mypy>=1.8,<2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
