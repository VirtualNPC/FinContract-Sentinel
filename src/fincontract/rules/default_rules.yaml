- id: negative_amount
  name: Detect negative amounts
  type: regex
  pattern: "\\b-\\d+(?:\\.\\d+)?\\b"
  risk_score: 60
  message: "Negative amount detected"
  basis_required: true
  basis_refs:
    - INTERNAL_FINANCE_POLICY#amount_positive

- id: missing_currency
  name: Missing currency marker
  type: keyword_absent
  keyword: "USD"
  risk_score: 20
  message: "Currency marker missing"
  basis_required: true
  basis_refs:
    - INTERNAL_FINANCE_POLICY#currency_required

- id: approval_clause
  name: Approval clause
  type: keyword
  keyword: "approval"
  risk_score: 15
  message: "Approval clause found"
  basis_required: true
  basis_refs:
    - INTERNAL_CONTRACT_POLICY#approval_clause
